# Supabase Configuration File
# https://supabase.com/docs/guides/local-development/cli/config

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
port = 54327
file_size_limit = "50MiB"

[auth]
enabled = true
port = 54328
api_external_url = "http://localhost:54328"
max_session_duration = "720h"

[realtime]
enabled = true
port = 54329

[edge_functions]
enabled = true
port = 54330

[functions.whatsapp-send-invite]
verify_jwt = true

[functions.whatsapp-auto-invite]
verify_jwt = false

[functions.whatsapp-bulk-invite]
verify_jwt = true

[analytics]
enabled = false
port = 54331
vector_port = 54332

# SMTP configuration for sending emails
[smtp]
host = ""
port = 587
user = ""
pass = ""
sender_name = ""

# Experimental features
[experimental]
orioledb_version = ""
