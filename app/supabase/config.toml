# Supabase Configuration File
# https://supabase.com/docs/guides/local-development/cli/config

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true

[auth.email]
enable_confirmations = false

[realtime]
enabled = true

# edge_functions block was removed as it's invalid in new configs

[functions.whatsapp-send-invite]
verify_jwt = true

[functions.whatsapp-auto-invite]
verify_jwt = false

[functions.whatsapp-bulk-invite]
verify_jwt = true

[functions.send-email]
verify_jwt = true

[analytics]
enabled = false
port = 54331
vector_port = 54332

# SMTP configuration for sending emails
# [smtp]
# host = ""
# port = 587
# user = ""
# pass = ""
# sender_name = ""

# Experimental features
# [experimental]
# orioledb_version = ""
